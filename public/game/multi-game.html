<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>鲨鱼之王 - 多账号</title>
    <meta
      name="viewport"
      content="width=device-width,user-scalable=no,initial-scale=1, minimum-scale=1,maximum-scale=1"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="renderer" content="webkit" />
    <meta name="force-rendering" content="webkit" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="full-screen" content="yes" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="360-fullscreen" content="true" />
    <meta name="screen-orientation" content="portrait" />
    <meta name="x5-orientation" content="portrait" />
    <meta name="x5-page-mode" content="app" />
    <link rel="stylesheet" type="text/css" href="style-mobile.1777a.css" />
    <link rel="icon" href="favicon.8de18.ico" />
  </head>
  <body>
    <canvas
      id="GameCanvas"
      oncontextmenu="event.preventDefault()"
      tabindex="0"
    ></canvas>
    <div id="splash">
      <div class="progress-bar stripes">
        <span style="width: 0%"></span>
      </div>
    </div>

    <script src="multi-game-storage-bridge.js" charset="utf-8"></script>
    <script type="text/javascript">
      (function loadMultiGameRuntime() {
        "use strict";

        if (!window.__MULTI_GAME_BRIDGE_READY__) return;

        const runtime = [
          "sdk_agent.min.js",
          "hortor-agent-shim.js",
          "manifest-override.js",
          "patch.decrypted_readable.js",
          "ws-capture.js",
          "src/settings.a1489.js",
          "game-defines.1653c.js",
          "official-version-sync.js",
          "main.2a00e.js",
          "cocos2d-js-min.a5841.js",
          "xh.js",
          "sh1.js",
          "bin-tool-drag-patch.js",
          "nightmare-skip.js",
          "map-zoom.js",
          "peach-auto.js",
          "diagnose_require.js",
        ];
        // v= 缓存穿透: 与 index.html 保持同一策略 —— 加载器脚本改动后必须重新拉取,
        // 否则客户端仍跑旧逻辑(现象: manifest 返回的还是旧的 0.32.0-android bundleVers)。
        const CACHE_TAG = "1017b";
        const loadScript = (src) =>
          new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src + (src.indexOf("?") >= 0 ? "&" : "?") + "v=" + CACHE_TAG;
            script.charset = "utf-8";
            script.onload = resolve;
            script.onerror = () => reject(new Error(`Unable to load ${src}`));
            document.head.appendChild(script);
          });
        const notify = (type, code) => {
          const { scope } = window.__MULTI_GAME_BRIDGE_READY__;
          window.parent.postMessage(
            {
              channel: "multi-game",
              version: 1,
              type,
              scope,
              ...(code ? { code } : {}),
            },
            window.location.origin,
          );
        };

        (async () => {
          for (const src of runtime) await loadScript(src);
          document.getElementById("minimizeBtn")?.click();
          window.HtmlIsLoaded = true;
          document.getElementById("splash").style.display = "none";
          // 等待官方 GAME_VERSION 探测定稿（最长 5s、永不 reject）再启动游戏
          await (window.__xyzwVersionSyncReady || Promise.resolve());
          await window.boot();
          notify("ready");
        })().catch((err) => {
          const splash = document.getElementById("splash");
          splash.style.display = "block";
          splash.textContent =
            "游戏资源加载失败: " +
            ((err && (err.message || err)) || "未知错误") +
            "（按 F12 看 Console 首条红色报错）";
          notify("fatal", "runtime-load-failed");
        });
      })();
    </script>
  </body>
</html>
